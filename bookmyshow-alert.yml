name: BookMyShow ticket alert

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .cache/bms-alert-state
          key: bms-alert-state-${{ github.run_id }}
          restore-keys: bms-alert-state-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser checker
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check BookMyShow and alert Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python bms_ticket_watcher.py
          "https://in.bookmyshow.com/movies/chennai/avengers-doomsday/buytickets/ET00526306/20261217?etCodes=ET00526306&language=english&refEventCode=ET00526306"
          --once --state-file .cache/bms-alert-state/state.json
      - uses: actions/cache/save@v4
        with:
          path: .cache/bms-alert-state
          key: bms-alert-state-${{ github.run_id }}
